<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Warlocking</title>
<style>
  :root { --ground: #F5F3F8; --surface: #FFFFFF; --ink: #1E1A26; --muted: #6A6378; --line: #DDD8E6; --accent: #6C3FB5; --ok: #1E7F4F; --bad: #B3261E; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --ground: #15121B; --surface: #1F1B28; --ink: #ECE8F3; --muted: #A69EB6; --line: #342E42; --accent: #B592F0; --ok: #6FD3A0; --bad: #F2A39C; }
  }
  body { margin: 0; padding: 32px 16px; background: var(--ground); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.01em; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  .status { font-weight: 600; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); } dd { margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .bar img { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line); }
  code { font: 13px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <h1>Forever Warlocking</h1>
  <p class="muted">Placeholder page. The practice sim is not built yet — this only shows that the Warlock data and engine copied from the DPS sim load and work.</p>
  <section class="card">
    <p id="status" class="status">Loading…</p>
    <dl id="facts"></dl>
    <div id="bar" class="bar"></div>
  </section>
</main>

<!-- The vendored sim, in the order of vendor/warlock-sim/manifest.json -->
<script src="vendor/warlock-sim/data/consumables.js"></script>
<script src="vendor/warlock-sim/data/config.js"></script>
<script src="vendor/warlock-sim/data/talents.js"></script>
<script src="vendor/warlock-sim/data/spells.js"></script>
<script src="vendor/warlock-sim/data/races.js"></script>
<script src="vendor/warlock-sim/data/builds.js"></script>
<script src="vendor/warlock-sim/engine/stats.js"></script>
<script src="vendor/warlock-sim/engine/spelltable.js"></script>
<script src="vendor/warlock-sim/engine/rng.js"></script>
<script src="vendor/warlock-sim/engine/resist.js"></script>
<script src="vendor/warlock-sim/engine/rotation.js"></script>
<script src="vendor/warlock-sim/engine/sim.js"></script>
<script src="vendor/warlock-sim/engine/custom-builds.js"></script>
<script src="vendor/warlock-sim/engine/settings-code.js"></script>
<script src="vendor/warlock-sim/data/icons.js"></script>
<script src="vendor/warlock-sim/data/tooltips.js"></script>
<script>
(function () {
  var status = document.getElementById('status'), facts = document.getElementById('facts');
  function fact(k, v) { var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; facts.appendChild(dt); facts.appendChild(dd); }
  try {
    var cfg = JSON.parse(JSON.stringify(WL.DEFAULT_CONFIG)), build = WL.BUILDS[0];
    var stats = WL.computeStats(build, 'human', cfg), table = WL.buildSpellTable(build, stats, cfg);
    var fight = WL.simulateOnce(build, 'human', cfg, { seed: 1, duration: 60 });
    fact('Data', Object.keys(WL.SPELLS).length + ' spells, ' + WL.TALENTS.length + ' talents, ' + WL.BUILDS.length + ' builds, ' + Object.keys(WL.ICONS).length + ' icons');
    fact('Sample character', build.short + ', Human');
    fact('Spell power', String(Math.round(stats.sp)));
    fact('Shadow Bolt', Math.round(table.shadowBolt.directDmg) + ' per hit, ' + table.shadowBolt.cast + ' s cast');
    fact('Sample 60 s fight', fight.dps.toFixed(1) + ' DPS');
    var bar = document.getElementById('bar');
    Object.keys(table).forEach(function (k) {
      if (!WL.ICONS[k]) return;
      var img = document.createElement('img'); img.src = WL.ICONS[k]; img.alt = WL.SPELLS[k].name; img.title = WL.SPELLS[k].name; bar.appendChild(img);
    });
    status.textContent = 'Sim data and engine loaded.'; status.className = 'status ok';
    fetch('vendor/warlock-sim/manifest.json').then(function (r) { return r.json(); }).then(function (m) {
      fact('Copy of the sim', 'commit ' + m.commit + ', synced ' + m.synced);
    }).catch(function () {});
  } catch (e) {
    status.textContent = 'The sim copy did not load: ' + e.message; status.className = 'status bad';
  }
})();
</script>
</body>
</html>
